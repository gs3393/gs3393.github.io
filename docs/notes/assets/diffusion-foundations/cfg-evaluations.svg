<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img"><title>Condition dropout during training and two shared-weight evaluations during inference</title><defs><marker id="61747e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61747e"/></marker><marker id="187c80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#187c80"/></marker><marker id="bd633e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bd633e"/></marker><marker id="426fa4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426fa4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="24" y="30" font-size="22" fill="#223942" text-anchor="start" font-weight="600">Training: learn both condition settings</text><rect x="24" y="58" width="190" height="75" rx="10" fill="#edf5f5" stroke="#d3e1e4"/><text x="119.0" y="89.0" font-size="17" fill="#223942" text-anchor="middle" font-weight="400">Label c</text><text x="119.0" y="116.0" font-size="17" fill="#223942" text-anchor="middle" font-weight="400">or null (randomly)</text><line x1="220" y1="95" x2="283" y2="95" stroke="#61747e" stroke-width="2" marker-end="url(#61747e)"/><rect x="290" y="58" width="180" height="75" rx="10" fill="#edf5f5" stroke="#d3e1e4"/><text x="380.0" y="89.0" font-size="16" fill="#223942" text-anchor="middle" font-weight="400">One denoiser</text><text x="380.0" y="116.0" font-size="16" fill="#223942" text-anchor="middle" font-weight="400">input: xₜ, t, condition</text><line x1="475" y1="95" x2="538" y2="95" stroke="#61747e" stroke-width="2" marker-end="url(#61747e)"/><rect x="545" y="58"