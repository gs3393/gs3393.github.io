<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="513" viewBox="0 0 1060 513" role="img"><title>Classifier-free guidance extrapolates prediction vectors</title><defs><marker id="61747e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#61747e"/></marker><marker id="187c80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#187c80"/></marker><marker id="bd633e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bd633e"/></marker><marker id="426fa4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#426fa4"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="40" font-size="24" fill="#223942" text-anchor="start" font-weight="600">Same input, same noise level — different predictions</text><line x1="105" y1="361" x2="715" y2="100" stroke="#bd633e" stroke-width="3" marker-end="url(#bd633e)"/><circle cx="715" cy="100" r="5" fill="#bd633e"/><line x1="105" y1="361" x2="535" y2="190" stroke="#187c80" stroke-width="3" marker-end="url(#187c80)"/><circle cx="535" cy="190" r="5" fill="#187c80"/><line x1="105" y1="361" x2="355" y2="280" stroke="#426fa4" stroke-width="3" marker-end="url(#426fa4)"/><circle cx="355" cy="280" r="5" fill="#426fa4"/><line x1="355" y1="280" x2="535" y2="190" stroke="#61747e" stroke-width="2" marker-end="url(#61747e)" stroke-dasharray="7 6"/><line x1="535" y1="190" x2="715" y2="100" stroke="#61747e" stroke-width="2" marker-end="url(#61747e)" stroke-dasharray="7 6"/><text x="80" y="395" font-size="21" fill="#223942" text-anchor="start" font-weight="400">0</text><text x="375" y="302" font-size="21" fill="#426fa4" text-anchor="start" font-weight="400">Unconditional, γ = 0</text><text x="558" y="209" font-size="21" fill="#187c80" text-anchor="start" font-weight="400">Conditional, γ = 1</text><text x="735" y="106" font-size="22" fill="#bd633e" text-anchor="start" font-weight="400">Guided, γ = 2</text><text x="714" y="259" font-size="18" fill="#61747e" text-anchor="start" font-weight="400">One difference</text><text x="714" y="283" font-size="18" fill="#61747e" text-anchor="start" font-weight="400">beyond conditional</text><rect x="40" y="422" width="975" height="63" rx="10" fill="#f4f7f8" stroke="#d3e1e4"/><text x="527.5" y="460.5" font-size="22" fill="#223942" text-anchor="middle" font-weight="400">guided = unconditional + γ × (conditional − unconditional)</text></g></svg>